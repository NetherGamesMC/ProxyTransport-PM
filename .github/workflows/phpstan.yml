name: PHPStan CI

on: push

jobs:
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-22.04
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Startup
        uses: actions/checkout@v6
      - name: Install FFI
        run: sudo apt install -y libffi7
      - name: Download PHP Release
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          file: PHP-8.4-Linux-x86_64-PM5.tar.gz
          repo: NetherGamesMC/php-build-scripts
          version: "tags/pm5-php-8.4-latest"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack PHP Release
        run: tar -xzvf PHP-8.4-Linux-x86_64-PM5.tar.gz
      - name: Download Composer
        run: curl -o ./bin/composer.phar "https://getcomposer.org/composer-stable.phar"
      - name: Add Composer GitHub access token
        run: ./bin/php7/bin/php ./bin/composer.phar config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
      - name: Install Composer dependencies
        run: ./bin/php7/bin/php ./bin/composer.phar install --prefer-dist --no-interaction
      - name: Run PHPStan
        run: ./bin/php7/bin/php vendor/bin/phpstan.phar analyze --no-progress